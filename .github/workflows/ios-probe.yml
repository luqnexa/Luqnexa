name: iPhone Rust probe IPA
on:
  workflow_dispatch:
  push:
    paths:
      - 'platforms/ios/**'
      - '.github/workflows/ios-probe.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: Install project generator
        run: brew install xcodegen
      - name: Build iPhone static library
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/luqnexa-ios-cargo"
          mkdir -p platforms/ios/build platforms/ios/Resources
          cargo build --release -p nextime-ffi --target aarch64-apple-ios --locked
          cp "$CARGO_TARGET_DIR/aarch64-apple-ios/release/libnextime_ffi.a" platforms/ios/build/
      - name: Build unsigned iPhone app
        working-directory: platforms/ios
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild -project LuqnexaProbe.xcodeproj -scheme LuqnexaProbe -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/LuqnexaProbe.app build/Payload/
          cd build
          zip -qr LuqnexaProbe-unsigned.ipa Payload
          shasum -a 256 LuqnexaProbe-unsigned.ipa > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: LuqnexaProbe-unsigned-iphone
          path: |
            platforms/ios/build/LuqnexaProbe-unsigned.ipa
            platforms/ios/build/SHA256SUMS.txt
          if-no-files-found: error
