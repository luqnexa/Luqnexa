[workspace]
resolver = "2"
members = ["crates/nextime-core", "crates/nextime-parser", "crates/nextime-convert", "crates/nextime-cli", "crates/nextime-ffi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"

[profile.release]
lto = "thin"
codegen-units = 1

[workspace.dependencies]
nextime-core = { path = "crates/nextime-core" }
nextime-parser = { path = "crates/nextime-parser" }
nextime-convert = { path = "crates/nextime-convert" }
nextime-cli = { path = "crates/nextime-cli" }
nextime-ffi = { path = "crates/nextime-ffi" }
nexc-core = { path = "modules/NEXC/crates/nexc-core" }
nexc-lite = { path = "modules/NEXC/crates/nexc-lite" }
nexc-max = { path = "modules/NEXC/crates/nexc-max" }
nextime-dict = { path = "modules/NEXC/crates/nextime-dict" }
nextime-ai = { path = "modules/Luqnexa-AI/crates/nextime-ai" }
nextime-ranker = { path = "modules/Luqnexa-AI/crates/nextime-ranker" }
